<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VipNetflix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">VipNetflix</a>
    <nav>
      <a href="#inicio">Início</a>
      <a href="#series">Séries</a>
      <a href="#planos">Planos</a>
    </nav>
    <input id="searchInput" class="search" placeholder="Pesquisar..." aria-label="Pesquisar">
  </header>

  <main id="inicio">
    <section class="hero">
      <div>
        <span class="badge">VIPNETFLIX</span>
        <h1>Seu catálogo de entretenimento</h1>
        <p>Filmes e séries organizados por capas, temporadas e episódios.</p>
        <a class="button" href="#planos">Ver planos</a>
      </div>
    </section>

    <section id="series" class="section">
      <div class="section-title">
        <h2>Séries</h2>
        <span id="seriesCount"></span>
      </div>
      <div id="seriesGrid" class="grid"></div>
    </section>

    <section id="planos" class="section">
      <div class="section-title"><h2>Planos</h2></div>
      <div id="plansGrid" class="plans"></div>
    </section>
  </main>

  <div id="detailsModal" class="modal" aria-hidden="true">
    <div class="modal-box">
      <button id="closeModal" class="close" aria-label="Fechar">×</button>
      <div id="detailsContent"></div>
    </div>
  </div>

  <div id="checkoutModal" class="modal" aria-hidden="true">
    <div class="modal-box small">
      <button id="closeCheckout" class="close" aria-label="Fechar">×</button>
      <h2 id="checkoutTitle">Checkout</h2>
      <p id="checkoutDescription"></p>
      <div class="checkout-note">
        O botão abaixo deve apontar para o checkout oficial do seu provedor de pagamento.
      </div>
      <a id="checkoutButton" class="button full" href="#" target="_blank" rel="noopener">Continuar para pagamento</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

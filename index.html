<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>VipNetflix</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- ================= ABERTURA ================= -->

  <section id="splash" class="screen splash">

    <div class="splash-bg"></div>

    <div class="splash-content">

      <div class="logo">
        <span>VIP</span>NETFLIX<span class="dot">.</span>
      </div>

      <p>Todo o seu catálogo em um só lugar.</p>
      <p>Sem limites, sem interrupções.</p>

      <button class="main-button" onclick="showHome()">
        ENTRAR →
      </button>

    </div>

  </section>


  <!-- ================= APP PRINCIPAL ================= -->

  <section id="mainApp" class="screen hidden">

    <!-- HEADER -->

    <header class="header">

      <button class="icon-button" onclick="toggleMenu()">☰</button>

      <div class="logo small">
        <span>VIP</span>NETFLIX
      </div>

      <button class="icon-button" onclick="showSearch()">⌕</button>

    </header>


    <!-- CONTEÚDO -->

    <main id="content"></main>


    <!-- MENU INFERIOR -->

    <nav class="bottom-nav">

      <button onclick="showHome()">
        🏠
        <small>Início</small>
      </button>

      <button onclick="showCatalog()">
        🔥
        <small>Lançamentos</small>
      </button>

      <button onclick="showCatalog()">
        🎬
        <small>Catálogo</small>
      </button>

      <button onclick="showGenres()">
        ☷
        <small>Gêneros</small>
      </button>

      <button onclick="showFavorites()">
        ♥
        <small>Favoritos</small>
      </button>

      <button onclick="showDownloads()">
        ↓
        <small>Downloads</small>
      </button>

    </nav>

  </section>


  <!-- ================= MENU ================= -->

  <div id="sideMenu" class="side-menu">

    <button onclick="closeMenu()">✕</button>

    <div class="menu-logo">
      <span>VIP</span>NETFLIX
    </div>

    <button onclick="showHome(); closeMenu()">🏠 Início</button>
    <button onclick="showCatalog(); closeMenu()">🎬 Catálogo</button>
    <button onclick="showDownloads(); closeMenu()">⬇ Downloads</button>
    <button onclick="showFavorites(); closeMenu()">♥ Favoritos</button>
    <button onclick="showPlans(); closeMenu()">💳 Planos</button>
    <button onclick="showAccount(); closeMenu()">👤 Minha conta</button>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>

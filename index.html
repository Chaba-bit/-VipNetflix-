<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta name="theme-color" content="#070b10">

  <title>VipNetflix</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       TELA DE ABERTURA
  ====================================================== -->

  <section id="splash" class="splash">

    <div class="splash-background"></div>

    <div class="splash-content">

      <div class="brand-logo">
        <span>VIP</span>NETFLIX<span class="red-dot">.</span>
      </div>

      <p class="splash-text">
        Todo o seu catálogo em um só lugar.
      </p>

      <p class="splash-text">
        Sem limites, sem interrupções.
      </p>

      <button id="enterButton" class="enter-button">
        ENTRAR <span>→</span>
      </button>

    </div>

  </section>


  <!-- =====================================================
       APLICAÇÃO
  ====================================================== -->

  <div id="app" class="hidden">

    <!-- HEADER -->

    <header class="top-header">

      <button
        id="menuButton"
        class="header-button"
        aria-label="Abrir menu">
        ☰
      </button>

      <div class="header-logo">
        <span>VIP</span>NETFLIX
      </div>

      <button
        id="searchButton"
        class="header-button"
        aria-label="Pesquisar">
        ⌕
      </button>

    </header>


    <!-- CONTEÚDO -->

    <main id="content"></main>


    <!-- =================================================
         MENU INFERIOR
    ================================================== -->

    <nav class="bottom-navigation">

      <button data-page="home">
        <strong>⌂</strong>
        <small>Início</small>
      </button>

      <button data-page="catalog">
        <strong>🔥</strong>
        <small>Lançamentos</small>
      </button>

      <button data-page="catalog">
        <strong>▣</strong>
        <small>Catálogo</small>
      </button>

      <button data-page="genres">
        <strong>☷</strong>
        <small>Gêneros</small>
      </button>

      <button data-page="favorites">
        <strong>♥</strong>
        <small>Favoritos</small>
      </button>

      <button data-page="downloads">
        <strong>↓</strong>
        <small>Downloads</small>
      </button>

    </nav>

  </div>


  <!-- =====================================================
       MENU LATERAL
  ====================================================== -->

  <div id="menuOverlay" class="menu-overlay"></div>

  <aside id="sideMenu" class="side-menu">

    <button id="closeMenu" class="close-menu">
      ×
    </button>

    <div class="side-logo">
      <span>VIP</span>NETFLIX
    </div>

    <button data-menu-page="home">
      🏠 &nbsp; Início
    </button>

    <button data-menu-page="catalog">
      🎬 &nbsp; Catálogo
    </button>

    <button data-menu-page="downloads">
      ⬇️ &nbsp; Downloads
    </button>

    <button data-menu-page="favorites">
      ❤️ &nbsp; Favoritos
    </button>

    <button data-menu-page="plans">
      💳 &nbsp; Planos
    </button>

    <button data-menu-page="account">
      👤 &nbsp; Minha conta
    </button>

  </aside>


  <!-- JAVASCRIPT -->

  <script src="app.js"></script>

</body>
</html>

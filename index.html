<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VipNetflix</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================================
     TOAST
===================================================== -->

<div id="toast" class="toast"></div>


<!-- =====================================================
     AUTENTICAÇÃO
===================================================== -->

<section id="authScreen" class="auth-screen">

  <div class="auth-box">

    <div class="logo">
      VipNetflix
    </div>

    <!-- LOGIN -->

    <div id="loginForm">

      <h1>Entrar</h1>

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Palavra-passe"
      >

      <button
        class="primary-btn full-btn"
        onclick="loginUser()"
      >
        Entrar
      </button>

      <button
        class="text-btn"
        onclick="showAuthForm('forgot')"
      >
        Esqueci a palavra-passe
      </button>

      <p>
        Ainda não tens conta?
      </p>

      <button
        class="secondary-btn full-btn"
        onclick="showAuthForm('register')"
      >
        Criar conta
      </button>

    </div>


    <!-- REGISTRO -->

    <div id="registerForm" class="hidden">

      <h1>Criar conta</h1>

      <input
        id="registerName"
        type="text"
        placeholder="Nome"
      >

      <input
        id="registerEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="registerPhone"
        type="tel"
        placeholder="Telefone"
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="Palavra-passe"
      >

      <input
        id="registerPasswordConfirm"
        type="password"
        placeholder="Confirmar palavra-passe"
      >

      <button
        class="primary-btn full-btn"
        onclick="registerUser()"
      >
        Criar conta
      </button>

      <button
        class="text-btn"
        onclick="showAuthForm('login')"
      >
        Voltar para entrar
      </button>

    </div>


    <!-- RECUPERAÇÃO -->

    <div id="forgotForm" class="hidden">

      <h1>Recuperar conta</h1>

      <input
        id="forgotEmail"
        type="email"
        placeholder="Digite seu email"
      >

      <button
        class="primary-btn full-btn"
        onclick="recoverPassword()"
      >
        Recuperar
      </button>

      <button
        class="text-btn"
        onclick="showAuthForm('login')"
      >
        Voltar
      </button>

    </div>

  </div>

</section>


<!-- =====================================================
     PERFIS
===================================================== -->

<section id="profileScreen" class="profile-screen hidden">

  <div class="profile-container">

    <h1>Quem está assistindo?</h1>

    <div id="profilesList" class="profiles-list"></div>

    <button
      class="secondary-btn"
      onclick="createProfile()"
    >
      ＋ Adicionar perfil
    </button>

  </div>

</section>


<!-- =====================================================
     APLICAÇÃO
===================================================== -->

<main id="mainApp" class="hidden">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="logo">
    VipNetflix
  </div>

  <nav class="desktop-nav">

    <button
      class="nav-link active"
      data-page="home"
      onclick="showPage('home')"
    >
      Início
    </button>

    <button
      class="nav-link"
      data-page="series"
      onclick="showPage('series')"
    >
      Séries
    </button>

    <button
      class="nav-link"
      data-page="movies"
      onclick="showPage('movies')"
    >
      Filmes
    </button>

    <button
      class="nav-link"
      data-page="new"
      onclick="showPage('new')"
    >
      Novidades
    </button>

    <button
      class="nav-link"
      data-page="mylist"
      onclick="showPage('mylist')"
    >
      Minha Lista
    </button>

    <button
      class="nav-link"
      data-page="plans"
      onclick="showPage('plans')"
    >
      Planos
    </button>

  </nav>


  <div class="header-actions">

    <button
      onclick="showPage('explore')"
      class="icon-btn"
    >
      🔍
    </button>

    <button
      onclick="changeProfile()"
      class="profile-mini"
    >
      👤
    </button>

    <button
      onclick="toggleMobileMenu()"
      class="menu-btn"
    >
      ☰
    </button>

  </div>

</header>


<!-- =====================================================
     MOBILE MENU
===================================================== -->

<div id="mobileMenu" class="mobile-menu hidden">

  <button onclick="showPage('home')">
    Início
  </button>

  <button onclick="showPage('series')">
    Séries
  </button>

  <button onclick="showPage('movies')">
    Filmes
  </button>

  <button onclick="showPage('new')">
    Novidades
  </button>

  <button onclick="showPage('mylist')">
    Minha Lista
  </button>

  <button onclick="showPage('downloads')">
    Downloads
  </button>

  <button onclick="showPage('history')">
    Histórico
  </button>

  <button onclick="showPage('explore')">
    Pesquisar
  </button>

  <button onclick="showPage('plans')">
    Planos
  </button>

  <button onclick="logoutUser()">
    Sair
  </button>

</div>


<!-- =====================================================
     HOME
===================================================== -->

<section id="home" class="page active">

  <div id="hero" class="hero">

    <div class="hero-content">

      <span class="hero-label">
        VIPNETFLIX
      </span>

      <h1 id="heroTitle">
        VipNetflix
      </h1>

      <div class="hero-meta">

        <span id="heroYear">
          2026
        </span>

        <span>•</span>

        <span id="heroGenre">
          Entretenimento
        </span>

      </div>

      <p id="heroDescription">
        Bem-vindo ao VipNetflix.
      </p>

      <div class="hero-buttons">

        <button
          class="primary-btn"

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VipNetflix - Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#07090d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

.header{
  height:70px;
  background:#0d1118;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #252b35;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  color:#e50914;
}

.admin{
  color:#aaa;
  font-size:14px;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:25px;
}

h1{
  font-size:28px;
  margin-bottom:25px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:30px;
}

.card{
  background:#111720;
  border:1px solid #242c38;
  border-radius:12px;
  padding:20px;
}

.card span{
  color:#9da5b1;
  font-size:14px;
}

.card strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.panel{
  background:#111720;
  border:1px solid #242c38;
  border-radius:12px;
  padding:20px;
  margin-bottom:25px;
}

.panel h2{
  margin-bottom:20px;
  font-size:21px;
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  color:#bfc5ce;
  font-size:14px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #303846;
  background:#080b10;
  color:#fff;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#e50914;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:5px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
}

.btn-save{
  background:#e50914;
  color:#fff;
}

.btn-clear{
  background:#292f38;
  color:#fff;
}

.list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.item{
  background:#181f29;
  border-radius:10px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:15px;
}

.poster{
  width:60px;
  height:80px;
  border-radius:6px;
  object-fit:cover;
  background:#252c36;
}

.info{
  flex:1;
}

.info strong{
  display:block;
  font-size:17px;
  margin-bottom:5px;
}

.info small{
  color:#9da5b1;
}

.actions{
  display:flex;
  gap:8px;
}

.edit{
  background:#303844;
  color:#fff;
}

.delete{
  background:#b00009;
  color:#fff;
}

.empty{
  color:#89919d;
  text-align:center;
  padding:25px;
}

@media(max-width:700px){

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .form{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .container{
    padding:15px;
  }

  .item{
    align-items:flex-start;
  }

  .actions{
    flex-direction:column;
  }

  .actions button{
    padding:9px 12px;
  }
}

@media(max-width:420px){

  .cards{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .card{
    padding:14px;
  }

  .card strong{
    font-size:22px;
  }

  .header{
    padding:0 12px;
  }

  .admin{
    display:none;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    Vip<span>Netflix</span>
  </div>

  <div class="admin">
    PAINEL ADMINISTRATIVO
  </div>

</header>

<main class="container">

  <h1>🎬 Gerenciamento de Conteúdo</h1>

  <section class="cards">

    <div class="card">
      <span>Filmes</span>
      <strong id="totalMovies">0</strong>
    </div>

    <div class="card">
      <span>Séries</span>
      <strong id="totalSeries">0</strong>
    </div>

    <div class="card">
      <span>Episódios</span>
      <strong id="totalEpisodes">0</strong>
    </div>

    <div class="card">
      <span>Total</span>
      <strong id="totalContents">0</strong>
    </div>

  </section>


  <section class="panel">

    <h2 id="formTitle">➕ Adicionar conteúdo</h2>

    <form id="contentForm">

      <div class="form">

        <div class="field">
          <label>Nome do conteúdo</label>

          <input
            id="title"
            type="text"
            placeholder="Ex.: A Última Fronteira"
            required
          >
        </div>


        <div class="field">

          <label>Tipo</label>

          <select id="type">

            <option value="filme">
              Filme
            </option>

            <option value="serie">
              Série
            </option>

          </select>

        </div>


        <div class="field">

          <label>Categoria</label>

          <input
            id="category"
            type="text"
            placeholder="Ação, Drama, Comédia..."
          >

        </div>


        <div class="field">

          <label>Ano</label>

          <input
            id="year"
            type="number"
            placeholder="2026"
          >

        </div>


        <div class="field full">

          <label>Descrição</label>

          <textarea
            id="description"
            placeholder="Descrição do filme ou série..."
          ></textarea>

        </div>


        <div class="field full">

          <label>URL da capa</label>

          <input
            id="cover"
            type="url"
            placeholder="https://..."
          >

        </div>


        <div class="field full">

          <label>URL do vídeo autorizado</label>

          <input
            id="video"
            type="url"
            placeholder="https://..."
          >

        </div>


        <div class="field">

          <label>Temporada</label>

          <input
            id="season"
            type="number"
            min="1"
            value="1"
          >

        </div>


        <div class="field">

          <label>Número de episódios</label>

          <input
            id="episodes"
            type="number"
            min="0"
            value="0"
          >

        </div>


        <div class="field full">

          <div class="buttons">

            <button
              type="submit"
              class="btn-save"
            >
              💾 Salvar conteúdo
            </button>

            <button
              type="button"
              class="btn-clear"
              onclick="clearForm()"
            >
              Limpar
            </button>

          </div>

        </div>

      </div>

    </form>

  </section>


  <section class="panel">

    <h2>📚 Conteúdos cadastrados</h2>

    <div
      id="contentList"
      class="list"
    ></div>

  </section>

</main>


<script>

const STORAGE_KEY = "vipnetflix_contents";

let contents = [];

let editingId = null;


/* =========================
   CARREGAR
========================= */

function loadContents(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    contents =
      saved ? JSON.parse(saved) : [];

  }catch(error){

    contents = [];

  }

  renderContents();

}


/* =========================
   SALVAR
========================= */

function saveContents(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(contents)
  );

}


/* =========================
   FORMULÁRIO
========================= */

document
.getElementById("contentForm")
.addEventListener("submit", function(event){

  event.preventDefault();

  const title =
    document.getElementById("title").value.trim();

  const type =
    document.getElementById("type").value;

  const category =
    document.getElementById("category").value.trim();

  const year =
    document.getElementById("year").value;

  const description =
    document.getElementById("description").value.trim();

  const cover =
    document.getElementById("cover").value.trim();

  const video =
    document.getElementById("video").value.trim();

  const season =
    Number(
      document.getElementById("season").value
    ) || 1;

  const episodes =
    Number(
      document.getElementById("episodes").value
    ) || 0;


  const data = {

    title,
    type,
    category,
    year,
    description,
    cover,
    video,
    season,
    episodes

  };


  if(editingId){

    const index =
      contents.findIndex(
        item => item.id === editingId
      );

    if(index !== -1){

      contents[index] = {

        ...contents[index],
        ...data

      };

    }

  }else{

    contents.push({

      id:
        Date.now().toString(),

      ...data

    });

  }


  saveContents();

  clearForm();

  renderContents();

});


/* =========================
   MOSTRAR CONTEÚDOS
========================= */

function renderContents(){

  const list =
    document.getElementById("contentList");

  list.innerHTML = "";


  if(contents.length === 0){

    list.innerHTML =
      '<div class="empty">' +
      'Nenhum conteúdo cadastrado ainda.' +
      '</div>';

    updateStats();

    return;

  }


  contents.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "item";


    const poster =
      document.createElement("img");

    poster.className = "poster";

    poster.src =
      item.cover || "";

    poster.alt =
      item.title;

    poster.onerror = function(){

      this.style.display = "none";

    };


    const info =
      document.createElement("div");

    info.className = "info";


    const strong =
      document.createElement("strong");

    strong.textContent =
      item.title;


    const small =
      document.createElement("small");

    small.textContent =
      (
        item.type === "serie"
          ? "Série"
          : "Filme"
      ) +
      " • " +
      (item.category || "Sem categoria") +
      (item.year ? " • " + item.year : "");


    info.appendChild(strong);

    info.appendChild(small);


    const actions =
      document.createElement("div");

    actions.className = "actions";


    const editButton =
      document.createElement("button");

    editButton.className = "edit";

    editButton.textContent =
      "✏️ Editar";

    editButton.onclick =
      function(){

        editContent(item.id);

      };


    const deleteButton =
      document.createElement("button");

    deleteButton.className = "delete";

    deleteButton.textContent =
      "🗑️ Apagar";

    deleteButton.onclick =
      function(){

        deleteContent(item.id);

      };


    actions.appendChild(editButton);

    actions.appendChild(deleteButton);


    div.appendChild(poster);

    div.appendChild(info);

    div.appendChild(actions);


    list.appendChild(div);

  });


  updateStats();

}


/* =========================
   EDITAR
========================= */

function editContent(id){

  const item =
    contents.find(
      content => content.id === id
    );

  if(!item) return;


  editingId = id;


  document
  .getElementById("title")
  .value =
    item.title || "";


  document
  .getElementById("type")
  .value =
    item.type || "filme";


  document
  .getElementById("category")
  .value =
    item.category || "";


  document
  .getElementById("year")
  .value =
    item.year || "";


  document
  .getElementById("description")
  .value =
    item.description || "";


  document
  .getElementById("cover")
  .value =
    item.cover || "";


  document
  .getElementById("video")
  .value =
    item.video || "";


  document
  .getElementById("season")
  .value =
    item.season || 1;


  document
  .getElementById("episodes")
  .value =
    item.episodes || 0;


  document
  .getElementById("formTitle")
  .textContent =
    "✏️ Editar conteúdo";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================
   APAGAR
========================= */

function deleteContent(id){

  const item =
    contents.find(
      content => content.id === id
    );


  if(!item) return;


  const confirmed =
    confirm(
      "Apagar \"" +
      item.title +
      "\"?"
    );


  if(!confirmed) return;


  contents =
    contents.filter(
      content => content.id !== id
    );


  saveContents();

  renderContents();

}


/* =========================
   LIMPAR
========================= */

function clearForm(){

  document
  .getElementById("contentForm")
  .reset();


  document
  .getElementById("season")
  .value = 1;


  document
  .getElementById("episodes")
  .value = 0;


  editingId = null;


  document
  .getElementById("formTitle")
  .textContent =
    "➕ Adicionar conteúdo";

}


/* =========================
   ESTATÍSTICAS
========================= */

function updateStats(){

  const movies =
    contents.filter(
      item =>
        item.type === "filme"
    ).length;


  const series =
    contents.filter(
      item =>
        item.type === "serie"
    ).length;


  const episodes =
    contents.reduce(
      (total,item) =>
        total +
        (
          Number(item.episodes) || 0
        ),
      0
    );


  document
  .getElementById("totalMovies")
  .textContent =
    movies;


  document
  .getElementById("totalSeries")
  .textContent =
    series;


  document
  .getElementById("totalEpisodes")
  .textContent =
    episodes;


  document
  .getElementById("totalContents")
  .textContent =
    contents.length;

}


/* =========================
   INICIAR
========================= */

loadContents();

</script>

</body>
    </html>
